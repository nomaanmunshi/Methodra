name: Demo release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build Android demo
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug
      - name: Stage Android artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Methodra-demo-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: Methodra-demo-*.apk

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Test and build backend
        run: gradle -p backend test bootJar
      - name: Stage backend artifact
        run: cp backend/build/libs/*.jar "Methodra-backend-${GITHUB_REF_NAME}.jar"
      - uses: actions/upload-artifact@v7
        with:
          name: release-backend
          path: Methodra-backend-*.jar

  publish:
    needs: [android, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: release-backend
          path: release-files
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Methodra ${GITHUB_REF_NAME}"
